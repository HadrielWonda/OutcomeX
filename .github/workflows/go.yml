# .github/workflows/go.yml

name: Go

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'
          
      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-
            
      - name: Run tests
        run: go test -v -coverprofile=coverage.out \
              -coverpkg=./... \
              -race \
              -timeout 2m \
              ./...
        
      - name: Upload coverage
        uses: codecov/codecov-action@v3
        with:
          file: coverage.out
          
      - name: Lint
        uses: golangci/golangci-lint-action@v3
        with:
          version: v1.54
          
  benchmark:
    name: Benchmark
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v4
        with:
          go-version: '1.21'
      - run: go test -benchmem -run=^$ -bench . ./internal/outcomex